name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 20 · 语法检查 + npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # 本仓库零依赖、无 lockfile：有 lockfile 才真正安装，否则跳过（标准 §6 的 npm ci || true）。
      - name: 安装依赖
        run: npm ci || true

      - name: 语法检查（入口）
        run: node --check index.js

      - name: 语法检查（全部 .mjs 测试）
        run: find . -name '*.mjs' -not -path './node_modules/*' -exec node --check {} +

      - name: 测试（manifest + 资产清单校验 + stdio 握手）
        run: npm test
